<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trainer Paul's Pokédex</title>
    <link rel="icon" type="image/png" href="images/profile-pixelart-pokemon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="pokedex-outer-shell">
        <!-- Top Device Header (The Classic Pokédex Lens) -->
        <div class="pokedex-header">
            <div class="big-lens">
                <div class="lens-reflection"></div>
            </div>
            <div class="mini-lights">
                <span class="light red"></span>
                <span class="light yellow"></span>
                <span class="light green"></span>
            </div>
        </div>

        <h1>Trainer Paul's Pokédex</h1>

        <!-- Main Body Containing Both Screens -->
        <div class="pokedex-container">

            <!-- Left Screen Section (Monitor & Stats) -->
            <div class="left-screen-panel">
                <div class="screen-border">
                    <div class="screen-indicators">
                        <span class="indicator-dot"></span>
                        <span class="indicator-dot"></span>
                    </div>
                    <div id="img-container" class="img-container">
                        <p>SELECT A POKEMON</p>
                    </div>
                    <div id="info-container" class="info-container">
                        <div class="info-header-row">
                            <p>No. ---</p>
                            <span style="min-width: 65px; text-align: right;"></span>
                        </div>
                        <h3>?????</h3>
                        <p>Type: ---</p>
                    </div>
                </div>

                <!-- Bottom Left Device Accents -->
                <div class="left-bottom-accents">
                    <div class="black-dot-btn"></div>
                    <div class="pill-buttons">
                        <span class="pill red-pill"></span>
                        <span class="pill blue-pill"></span>
                    </div>
                    <div class="green-speaker-screen">
                        <div class="speaker-line"></div>
                        <div class="speaker-line"></div>
                        <div class="speaker-line"></div>
                    </div>
                    <div class="d-pad">
                        <div class="d-pad-middle"></div>
                    </div>
                </div>
            </div>

            <!-- Center Hinge -->
            <div class="pokedex-hinge">
                <div class="hinge-bar"></div>
                <div class="hinge-bar"></div>
                <div class="hinge-bar"></div>
            </div>

            <!-- Right Panel: Prioritized Search & Interactive Controls -->
            <!-- Right Panel: Corrected Visual Hierarchy -->
            <div class="right-screen-panel">

                <!-- 1. Upper Black Data Status Screen -->
                <div class="upper-black-screen">
                    <p>DATABASE READY...</p>
                </div>

                <!-- 2. PRIMARY FOCUS: Search Section -->
                <div class="search-section">
                    <label for="search-input">Search Database:</label>
                    <div class="search-input-group">
                        <input type="text" id="search-input" name="search-input" placeholder="e.g. Pikachu, 25">
                        <button id="searchButton">Scan</button>
                    </div>
                </div>

                <!-- 3. SECONDARY FOCUS: Evolution Chain Module -->
                <div class="evolution-section">
                    <span
                        style="font-size:0.5rem; color:#a0aec0; font-family:'Press Start 2P', monospace; padding:12px; text-align:center; width:100%;">NO
                        EVOLUTION DATA</span>
                </div>
                <div class="secondary-controls-grid">
                    <div class="shiny-toggle-container">
                        <span>Shiny Mode:</span>
                        <label class="switch">
                            <input type="checkbox" id="shinyToggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="yellow-power-btn" title="System Power"></div>
                </div>

                <!-- Bottom Dark Display Slits for Height & Weight -->
                <div class="bottom-dark-screens">
                    <div class="mini-screen-box">HT: ---</div>
                    <div class="mini-screen-box">WT: ---</div>
                </div>
                <!-- 4. Trainer Portfolio Card-->
                <a href="https://paulquimpo-portfolio.vercel.app/" target="_blank" rel="noopener noreferrer"
                    class="portfolio-trainer-card">
                    <div class="trainer-avatar-icon">
                        <img src="images/profile-pixelart-pokemon.png" alt="Trainer Profile">
                    </div>
                    <div class="trainer-card-text">
                        <span class="trainer-card-title">DEVELOPER PROFILE</span>
                        <span class="trainer-card-subtitle">VIEW TRAINER PORTFOLIO ↗</span>
                    </div>
                </a>


                <!-- 5. Decorative Keypad Grid & Secondary Controls -->
                <div class="keypad-grid">
                    <div class="keypad-btn"></div>
                    <div class="keypad-btn"></div>
                    <div class="keypad-btn"></div>
                    <div class="keypad-btn"></div>
                    <div class="keypad-btn"></div>
                    <div class="keypad-btn"></div>
                    <div class="keypad-btn"></div>
                    <div class="keypad-btn"></div>
                </div>



            </div>

        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
