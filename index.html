<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trainer Paul's Pokédex</title>
    <link rel="icon" type="image/png" href="images/profile-pixelart-pokemon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="pokedex-outer-shell">
        <!-- Top Device Header (The Classic Pokédex Lens) -->
        <div class="pokedex-header">
            <div class="big-lens">
                <div class="lens-reflection"></div>
            </div>
            <div class="mini-lights">
                <span class="light red"></span>
                <span class="light yellow"></span>
                <span class="light green"></span>
            </div>
        </div>

        <h1>Trainer Paul's Pokédex</h1>

        <!-- Main Body Containing Both Screens -->
        <div class="pokedex-container">

            <!-- Left Screen Section (Monitor & Stats) -->
            <div class="left-screen-panel">
                <div class="screen-border">
                    <div class="screen-indicators">
                        <span class="indicator-dot"></span>
                        <span class="indicator-dot"></span>
                    </div>
                    <div id="img-container" class="img-container">
                        <p>SELECT A POKEMON</p>
                    </div>
                    <div id="info-container" class="info-container">
                        <div class="info-header-row">
                            <p>No. ---</p>
                            <span style="min-width: 65px; text-align: right;"></span>
                        </div>
                        <h3>?????</h3>
                        <p>Type: ---</p>
                    </div>
                </div>

                <!-- Retro Audio Player Module -->
                <div class="music-player-panel">
                    <div class="music-screen-container">
                        <div class="music-screen" id="now-playing">NOW PLAYING: Littleroot Town ~ (R/S/E)</div>
                    </div>
                    <select id="trackSelect" class="music-select">
                        <option value="0">Littleroot Town ~ (R/S/E)</option>
                        <option value="117">Route 101 ~ (R/S/E)</option>
                        <option value="194">Oldale Town ~ (R/S/E)</option>
                        <option value="282">Rustboro City ~ (R/S/E)</option>
                        <option value="414">Dewford Town ~ (R/S/E)</option>
                        <option value="558">Oceanic Museum ~ (R/S/E)</option>
                        <option value="713">Verdanturf Town ~ (R/S/E)</option>
                        <option value="815">Fallabor Town ~ (R/S/E)</option>
                        <option value="932">Surf ~ (R/S/E)</option>
                        <option value="1084">Lilycove City ~ (R/S/E)</option>
                        <option value="1207">Dive ~ (R/S/E)</option>
                        <option value="1366">Ending Theme ~ (R/S/E)</option>
                        <option value="1540">New Bark Town ~ (HG/SS)</option>
                        <option value="1611">Azalea Town ~ (HG/SS)</option>
                        <option value="1674">Goldenrod City ~ (HG/SS)</option>
                        <option value="1720">Nature Park ~ (HG/SS)</option>
                        <option value="1842">Surfing ~ (HG/SS)</option>
                        <option value="1924">Cianwood City ~ (HG/SS)</option>
                        <option value="2008">Vermilion City ~ (HG/SS)</option>
                        <option value="2069">Pewter City ~ (HG/SS)</option>
                        <option value="2150">Route 47 ~ (HG/SS)</option>
                        <option value="2229">Route 201 ~ (D/P/Pt)</option>
                        <option value="2297">Floaroma Town ~ (D/P/Pt)</option>
                        <option value="2446">Route 209 ~ (D/P/Pt)</option>
                        <option value="2603">Canalave City ~ (D/P/Pt)</option>
                        <option value="2771">Ending ~ (D/P/Pt)</option>
                        <option value="3046">Pallet Town ~ (FR/LG)</option>
                        <option value="3143">Cerulean City ~ (FR/LG)</option>
                        <option value="3219">Vermilion City ~ (FR/LG)</option>
                        <option value="3304">Cycling ~ (FR/LG)</option>
                        <option value="3382">Celadon City ~ (FR/LG)</option>
                        <option value="3468">Ending Theme ~ (FR/LG)</option>
                    </select>
                    <div class="music-controls-row">
                        <button id="prevTrackBtn" class="music-btn">PREV</button>
                        <button id="playPauseBtn" class="music-btn primary-play-btn">PAUSE</button>
                        <button id="nextTrackBtn" class="music-btn">NEXT</button>
                    </div>
                </div>

                <!-- Bottom Left Device Accents -->
                <div class="left-bottom-accents">
                    <div class="black-dot-btn"></div>
                    <div class="pill-buttons">
                        <span class="pill red-pill"></span>
                        <span class="pill blue-pill"></span>
                    </div>
                    <div class="green-speaker-screen">
                        <div class="speaker-line"></div>
                        <div class="speaker-line"></div>
                        <div class="speaker-line"></div>
                    </div>
                    <div class="d-pad">
                        <div class="d-pad-middle"></div>
                    </div>
                </div>
            </div>

            <!-- Center Hinge -->
            <div class="pokedex-hinge">
                <div class="hinge-bar"></div>
                <div class="hinge-bar"></div>
                <div class="hinge-bar"></div>
            </div>

            <!-- Right Panel: Prioritized Search & Interactive Controls -->
            <div class="right-screen-panel">

                <!-- 1. Upper Black Data Status Screen -->
                <div class="upper-black-screen">
                    <p>DATABASE READY...</p>
                </div>

                <!-- 2. PRIMARY FOCUS: Search Section -->
                <div class="search-section">
                    <label for="search-input">Search Database:</label>
                    <div class="search-input-group">
                        <input type="text" id="search-input" name="search-input" placeholder="e.g. Pikachu, 25">
                        <button id="searchButton">Scan</button>
                    </div>
                </div>

                <!-- 3. SECONDARY FOCUS: Evolution Chain Carousel Module -->
                <div class="evolution-section">
                    <span
                        style="font-size:0.5rem; color:#a0aec0; font-family:'Press Start 2P', monospace; padding:12px; text-align:center; width:100%;">NO
                        EVOLUTION DATA</span>
                </div>
                <div class="secondary-controls-grid">
                    <div class="shiny-toggle-container">
                        <span>Shiny Mode:</span>
                        <label class="switch">
                            <input type="checkbox" id="shinyToggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="yellow-power-btn" title="System Power"></div>
                </div>

                <!-- Bottom Dark Display Slits for Height & Weight -->
                <div class="bottom-dark-screens">
                    <div class="mini-screen-box">HT: ---</div>
                    <div class="mini-screen-box">WT: ---</div>
                </div>

                <!-- 4. Trainer Portfolio Card-->
                <a href="https://paulquimpo-portfolio.vercel.app/" target="_blank" rel="noopener noreferrer"
                    class="portfolio-trainer-card">
                    <div class="trainer-avatar-icon">
                        <img src="images/profile-pixelart-pokemon.png" alt="Trainer Profile">
                    </div>
                    <div class="trainer-card-text">
                        <span class="trainer-card-title">DEVELOPER PROFILE</span>
                        <span class="trainer-card-subtitle">VIEW TRAINER PORTFOLIO ↗</span>
                    </div>
                </a>

                <!-- 5. Decorative Keypad Grid & Secondary Controls -->
                <div class="keypad-grid">
                    <div class="keypad-btn"></div>
                    <div class="keypad-btn"></div>
                    <div class="keypad-btn"></div>
                    <div class="keypad-btn"></div>
                    <div class="keypad-btn"></div>
                    <div class="keypad-btn"></div>
                    <div class="keypad-btn"></div>
                    <div class="keypad-btn"></div>
                </div>

            </div>

        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
